name: Build and publish the E5's Linux
run-name: ${{ inputs.wrt_distro || 'immortalwrt' }} ${{ inputs.wrt_version || (inputs.wrt_distro == 'openwrt' && '25.12.5' || '25.12.2') }} · ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      wrt_distro:
        description: Base distribution (ImmortalWrt, or OpenWrt itself)
        type: choice
        options: [immortalwrt, openwrt]
        default: immortalwrt
        required: true
      wrt_version:
        description: 'Base release (empty: the distribution default)'
        default: ''
        required: false
      kernel_ref:
        description: linux-lts-e5 branch, tag or commit
        default: e5-6.18
        required: true
      infoscreen_ref:
        description: infoscreen branch, tag or commit
        default: main
        required: true
      plugins_ref:
        description: infoscreen-plugins branch, tag or commit
        default: main
        required: true
      publish:
        description: Publish a GitHub Release after validation
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flash-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: CST-8
  # the distribution and its release (openwrt/wrt-distro.sh): ImmortalWrt by
  # default, with OpenWrt itself selectable for the same tree
  E5_WRT_DISTRO: ${{ inputs.wrt_distro || 'immortalwrt' }}
  E5_WRT_VER: ${{ inputs.wrt_version || (inputs.wrt_distro == 'openwrt' && '25.12.5' || '25.12.2') }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.start.outputs.release_tag }}
      title: ${{ steps.verify.outputs.release_title }}
      source: ${{ steps.source.outputs.commit }}
    steps:
      # Pipeline errors must survive tee, otherwise validation reports a later
      # missing archive instead of the original build failure.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check bootstrap configuration
        env:
          INPUTS_URL: ${{ vars.E5_CI_INPUTS_URL }}
          INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
        run: |
          [[ "$INPUTS_URL" == https://* ]] || { echo '::error::Set E5_CI_INPUTS_URL to the HTTPS bootstrap archive URL (docs/RELEASE.md).'; exit 1; }
          [[ "$INPUTS_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo '::error::Set E5_CI_INPUTS_SHA256 to its SHA-256 (docs/RELEASE.md).'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Enceka/linux-lts-e5
          ref: ${{ inputs.kernel_ref || vars.E5_KERNEL_REF || 'e5-6.18' }}
          path: linux-lts-e5
          fetch-depth: 128
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Enceka/infoscreen
          ref: ${{ inputs.infoscreen_ref || vars.E5_INFOSCREEN_REF || 'main' }}
          path: ci/infoscreen
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Enceka/infoscreen-plugins
          ref: ${{ inputs.plugins_ref || vars.E5_PLUGINS_REF || 'main' }}
          path: ci/infoscreen-plugins
          persist-credentials: false
      - name: Record sources and UTC+8 compile start
        id: start
        env:
          E5_CI_INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
          E5_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci-release.py prepare
      - name: Record e5-linux commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 e2fsprogs binutils python3
      - name: Restore and verify bootstrap inputs
        env:
          INPUTS_URL: ${{ vars.E5_CI_INPUTS_URL }}
          INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
        run: |
          curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/ci-inputs.tar.gz" "$INPUTS_URL"
          python3 tools/ci-inputs.py restore "$RUNNER_TEMP/ci-inputs.tar.gz" --sha256 "$INPUTS_SHA256"
      - name: Check installer and audio logic
        run: |
          bash -n openwrt/wrt-distro.sh openwrt/make-flash-bundle.sh openwrt/build-rootfs.sh upstream/build.sh
          # The GPT and bounded-write tests need a disposable userspace of the
          # distribution being built (E5_WRT_DISTRO / E5_WRT_VER above).
          . openwrt/wrt-distro.sh
          mkdir -p work/openwrt
          curl -fsSL --retry 5 "$E5_WRT_URL/$E5_WRT_TARBALL" -o "work/openwrt/$E5_WRT_TARBALL"
          curl -fsSL --retry 5 "$E5_WRT_URL/sha256sums" -o work/openwrt/sha256sums
          checksum=$(awk -v file="$E5_WRT_TARBALL" '$2 == "*" file || $2 == file { print $1 }' work/openwrt/sha256sums)
          [ -n "$checksum" ] || { echo "::error::No checksum for $E5_WRT_TARBALL"; exit 1; }
          printf '%s  %s\n' "$checksum" "work/openwrt/$E5_WRT_TARBALL" | sha256sum --check
          docker import --platform linux/arm64 "work/openwrt/$E5_WRT_TARBALL" "$E5_WRT_BASE_IMAGE"
          python3 openwrt/tests/flash-diagnostics.py
          E5_TEST_IMAGE="$E5_WRT_BASE_IMAGE" python3 openwrt/tests/gpt-plan.py
          python3 openwrt/tests/voice-audio.py
          python3 openwrt/tests/dual-sms.py
          python3 openwrt/tests/dual-sms-send.py
          python3 openwrt/tests/sim-probe.py
          E5_TEST_IMAGE="$E5_WRT_BASE_IMAGE" python3 openwrt/tests/sim-lock.py
          E5_TEST_IMAGE="$E5_WRT_BASE_IMAGE" python3 openwrt/tests/luci-firstboot.py
          E5_TEST_IMAGE="$E5_WRT_BASE_IMAGE" python3 openwrt/tests/image-download.py
          node openwrt/tests/luci-sim-slots.cjs
          python3 magisk/tests.py
          python3 rootfs/tests/sd-registry.py
          python3 rootfs/tests/early-sd-firmware.py
          E5_TEST_IMAGE="$E5_WRT_BASE_IMAGE" python3 rootfs/tests/sd-write.py
          python3 rootfs/tests/voice-state.py
          python3 rootfs/tests/modem-coldboot.py
          python3 tools/tests/ci-release.py
          python3 tools/tests/openwrt-package-state.py
          python3 ci/infoscreen-plugins/tools/check.py
          if [ -f ci/infoscreen/tests/network-checks.sh ]; then
            E5_TEST_IMAGE="$E5_WRT_BASE_IMAGE" bash ci/infoscreen/tests/network-checks.sh
            python3 ci/infoscreen/tests/usb-reset.py
          fi
      - name: Build ARM64 toolchain container
        # The Docker Hub egress of a shared runner hits "429 Too Many Requests"
        # and "504 Gateway Timeout" fetching ubuntu:26.04 often enough to stop
        # builds that have nothing wrong with them; retry before giving up.
        run: |
          for n in 1 2 3 4 5 6; do
            if docker build -t e5-mainline-build upstream/; then
              exit 0
            fi
            echo "docker build failed (attempt $n) -- Docker Hub rate limiting?" >&2
            sleep $((n * 30))
          done
          echo "::error::docker build failed after 6 attempts" >&2
          exit 1
      - name: Compile the release kernel
        env:
          E5_RELEASE: '1'
        run: bash upstream/build.sh
      - name: Restore patched distribution packages
        id: packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            out/openwrt/*.apk
            out/openwrt/e5-modemmanager-build.json
          key: patched-apk-${{ runner.os }}-${{ runner.arch }}-${{ env.E5_WRT_DISTRO }}-${{ env.E5_WRT_VER }}-${{ hashFiles('tools/openwrt-package-state.py', 'openwrt/wrt-distro.sh', 'openwrt/tests/voice-identity.py', 'openwrt/tests/sim-power.py', 'openwrt/build-modemmanager.sh', 'openwrt/build-bluez.sh', 'openwrt/patches/**', 'rootfs/deb-patches/modemmanager-*.patch', 'rootfs/deb-patches/bluez-*.patch') }}
      - name: Compile patched ModemManager and BlueZ
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          bash openwrt/build-modemmanager.sh
          bash openwrt/build-bluez.sh
          # This volume belongs to this ephemeral runner. Free it before image assembly.
          docker volume rm "e5-$E5_WRT_DISTRO-src"
      - name: Save patched packages before image assembly
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            out/openwrt/*.apk
            out/openwrt/e5-modemmanager-build.json
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Assemble the generic mainline flash bundles
        env:
          E5_MAINLINE: '1'
          E5_TOOLS_BUILD_IMAGE: e5-mainline-build
        run: |
          set -o pipefail
          export E5_INFOSCREEN="$GITHUB_WORKSPACE/ci/infoscreen"
          export E5_INFOSCREEN_PLUGINS="$GITHUB_WORKSPACE/ci/infoscreen-plugins"
          bash openwrt/make-flash-bundle.sh 2>&1 | tee out/release/bundle-build.log
      - name: Package Android to Linux Magisk module
        run: bash magisk/build.sh
      - name: Validate release archives and sources
        id: verify
        run: python3 tools/ci-release.py verify
      - name: Upload validated release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flash-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/release/*.tar.gz
            out/release/*.zip
            out/release/SHA256SUMS
            out/release/build.json
            out/release/release-notes.md
          compression-level: 0
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/release/*.log
            out/release/build.json
            upstream/out-release/config
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flash-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Publish validated files through a draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTO_TAG: ${{ needs.build.outputs.tag }}
          TITLE: ${{ needs.build.outputs.title }}
          SOURCE: ${{ needs.build.outputs.source }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          sha256sum --check SHA256SUMS
          tag="$AUTO_TAG"
          if [ "$EVENT" = push ]; then tag="$REF_NAME"; fi
          # Refuse to replace a published release; failed uploads may leave a draft.
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ] || { echo '::error::Release already published; use a new tag or a manual build.'; exit 1; }
          else
            gh release create "$tag" --target "$SOURCE" --title "$TITLE" --notes-file release-notes.md --draft
          fi
          gh release upload "$tag" ./*.tar.gz ./*.zip SHA256SUMS build.json --clobber
          args=(--draft=false --title "$TITLE" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--prerelease=false --latest); fi
          gh release edit "$tag" "${args[@]}"
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
